[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kindlegarten"
dynamic = ["version"]
description = "A desktop app and CLI for backing up purchased Kindle and DLsite ebooks and comics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx[socks]>=0.28", "Pillow>=10", "img2pdf>=0.6", "playwright>=1.51"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.optional-dependencies]
browser = ["playwright>=1.51"]
comipo = ["playwright>=1.51", "cryptography>=42", "dlsite-async>=1.0.1,<2"]
dlsite = ["playwright>=1.51", "cryptography>=42", "dlsite-async>=1.0.1,<2"]
gui = ["PySide6-Essentials>=6.8,<7", "playwright>=1.51", "cryptography>=42", "dlsite-async>=1.0.1,<2"]

[project.scripts]
kindlegarten = "kindlegarten.cli:entrypoint"

[project.gui-scripts]
kindlegarten-gui = "kindlegarten.gui:entrypoint"

[project.urls]
Repository = "https://github.com/yinyanfr/kindlegarten"
Issues = "https://github.com/yinyanfr/kindlegarten/issues"

[tool.setuptools]
packages = ["kindlegarten"]

[tool.setuptools.dynamic]
version = {attr = "kindlegarten.__version__"}

[tool.setuptools.package-data]
kindlegarten = ["constraints.txt", "messages.json", "app-icon.png"]
